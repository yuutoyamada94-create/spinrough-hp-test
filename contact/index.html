  <body class="subpage detail-page contact-page">
    <header class="site-header" aria-label="サイトヘッダー">
      <a class="header-logo" href="/spinrough-hp-test/" aria-label="spin rough トップ"><img class="logo-dark" src="/spinrough-hp-test/assets/logo-type.svg" alt="spin rough" /><img class="logo-light" src="/spinrough-hp-test/assets/logo-type-white.svg" alt="" aria-hidden="true" /></a>
      <nav class="global-nav" aria-label="主要メニュー">
        <a href="/spinrough-hp-test/about/">私たちについて</a>
        <a href="/spinrough-hp-test/approach/">入り込む、とは</a>
        <a href="/spinrough-hp-test/service/">サービス</a>
        <a href="/spinrough-hp-test/case/">事例</a>
      </nav>
      <a class="header-contact" href="/spinrough-hp-test/contact/" aria-current="page">CONTACT</a>
    </header>

    <main>
      <section class="subpage-hero section" aria-labelledby="page-title">
        <div class="section-title"><p>CONTACT</p><h1 id="page-title">お問い合わせ</h1></div>
        <figure class="subpage-visual photo-window"><img src="/spinrough-hp-test/assets/gen/page-contact.png" alt="事務所の机に置かれた固定電話とノート" /></figure>
      </section>

      <section class="contact section" aria-labelledby="contact-title">
        <div class="contact-intro">
          <h2 id="contact-title">まず、話を聞かせてください。</h2>
          <p>最初は、お話をうかがうだけです。</p>
          <div class="phone-block">
            <span>電話</span>
            <a href="tel:0344001442">03-4400-1442</a>
            <p>受付時間:平日10:00〜20:00</p>
          </div>
        </div>
        <form class="contact-form" action="https://formspree.io/f/mpqvvbpg" method="post" data-contact-form>
          <label>会社名<input name="company" autocomplete="organization" /></label>
          <label>お名前<input name="name" autocomplete="name" required /></label>
          <label>電話番号<input name="phone" autocomplete="tel" data-contact-method /></label>
          <label>メールアドレス<input name="email" type="email" autocomplete="email" data-contact-method /></label>
          <label>ご相談内容<textarea name="message" rows="5" required></textarea></label>
          <button type="submit">相談する</button>
        </form>
      </section>
    </main>

    <footer class="site-footer top-footer">
      <div class="footer-message"><p><span>社長も、従業員も、</span><span>顧客も、豊かに。</span></p><img src="/spinrough-hp-test/assets/logo-word.svg" alt="" aria-hidden="true" /></div>

      <address>株式会社spin rough<br />東京都新宿区矢来町4番地11 Fullea神楽坂102<br />03-4400-1442 / info@spinrough.com</address>
    </footer>
